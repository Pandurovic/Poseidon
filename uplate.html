<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a4a78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PK Poseidon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Uplate - PK Poseidon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    /* Izvestaj za stampu: na ekranu je skriven, a pri stampi je jedino sto se vidi */
    #stampa { display: none; }
    @media print {
      @page { margin: 15mm; }
      body > *:not(#stampa) { display: none !important; }
      body { background: #fff !important; }
      #stampa { display: block; color: #000; }
      #stampa table { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid container-lg pb-5">
    <h1 class="h3 mb-3">Uplate</h1>
    <div id="alertBox"></div>

    <!-- Nova uplata -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-semibold">Nova uplata</div>
      <div class="card-body">
        <form id="uplataForm" class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Član *</label>
            <input type="search" id="trazi_clana" class="form-control mb-2" placeholder="Pretraži člana (ime ili prezime)...">
            <select id="clan_id" class="form-select" required><option value="">— izaberi člana —</option></select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Za mesec *</label>
            <input type="month" id="za_mesec" class="form-control" required>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Iznos (RSD) *</label>
            <input type="number" inputmode="decimal" id="iznos" class="form-control" min="0.01" step="0.01" required>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Datum uplate</label>
            <input type="date" id="datum_uplate" class="form-control">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Način plaćanja</label>
            <select id="nacin_placanja" class="form-select">
              <option value="gotovina">Gotovina</option>
              <option value="racun">Račun</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Napomena</label>
            <input id="napomena" class="form-control" autocomplete="off">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success w-100 w-md-auto px-4" id="sacuvajBtn">Sačuvaj uplatu</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Pregled po mesecu -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-2">
      <h2 class="h5 mb-0">Pregled uplata</h2>
      <div class="d-flex align-items-end gap-2">
        <div>
          <label class="form-label small mb-0">Mesec</label>
          <input type="month" id="filterMesec" class="form-control form-control-sm">
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="otvoriStampu()">🖨 Štampaj izveštaj</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 tabela-kartice">
          <thead class="table-light">
            <tr><th>Član</th><th>Datum uplate</th><th>Iznos</th><th>Način</th><th>Napomena</th><th></th></tr>
          </thead>
          <tbody id="tabela"><tr><td colspan="6" class="text-center text-muted py-4">Učitavanje...</td></tr></tbody>
          <tfoot id="ukupno" class="table-light fw-semibold"></tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- Prozor za izbor izvestaja -->
  <div class="modal fade" id="stampaModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="stampaForm">
        <div class="modal-header">
          <h5 class="modal-title">Štampanje izveštaja o uplatama</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zatvori"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Za mesec *</label>
            <input type="month" id="stampaMesec" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Vrsta uplate</label>
            <select id="stampaVrsta" class="form-select">
              <option value="">Sve vrste</option>
              <option value="gotovina">Gotovina</option>
              <option value="racun">Račun</option>
            </select>
          </div>
          <div id="stampaPoruka"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Otkaži</button>
          <button type="submit" class="btn btn-primary">Štampaj</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sadrzaj koji se stampa (vidi se samo pri stampi) -->
  <div id="stampa"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // Nazivi vrsta uplate (moraju da odgovaraju vrednostima u formi)
    const NAZIVI_VRSTA = { gotovina: 'Gotovina', racun: 'Račun' };
    const nazivVrste = v => NAZIVI_VRSTA[v] ?? v ?? '';

    let aktivniClanovi = [];

    (async () => {
      if (!(await requireLogin())) return;
      renderNavbar('uplate');

      // Ako dolazimo sa liste clanova ili dugovanja (uplate.html?clan=5&mesec=2026-10)
      const params = new URLSearchParams(window.location.search);
      const mesecIzUrl = params.get('mesec');
      const mesecPocetni = /^\d{4}-\d{2}$/.test(mesecIzUrl ?? '') ? mesecIzUrl : thisMonthStr();

      document.getElementById('za_mesec').value = mesecPocetni;
      document.getElementById('datum_uplate').value = todayStr();
      document.getElementById('filterMesec').value = mesecPocetni;

      await ucitajClanove();
      await ucitajUplate();

      const clanIzUrl = params.get('clan');
      if (clanIzUrl) {
        document.getElementById('clan_id').value = clanIzUrl;
        popuniIznos();
      }
    })();

    async function ucitajClanove() {
      const { data, error } = await db.from('clanovi')
        .select('id, ime, prezime, grupe(mesecna_clanarina)')
        .eq('aktivan', true)
        .order('prezime').order('ime');
      if (error) return showAlert('Greška pri učitavanju članova: ' + error.message);
      aktivniClanovi = data;
      prikaziOpcijeClanova('');
    }

    // Popuni listu clanova; q filtrira po imenu/prezimenu bez obzira na dijakritike
    function prikaziOpcijeClanova(q) {
      const sel = document.getElementById('clan_id');
      const izabran = sel.value;
      const nq = norm(q.trim());
      const lista = aktivniClanovi.filter(c => !nq || norm(`${c.prezime} ${c.ime}`).includes(nq));

      sel.innerHTML =
        `<option value="">— izaberi člana${nq ? ` (${lista.length})` : ''} —</option>` +
        lista.map(c => `<option value="${c.id}">${escapeHtml(c.prezime)} ${escapeHtml(c.ime)}</option>`).join('');

      if (lista.length === 1 && nq) {
        sel.value = lista[0].id;       // samo jedan pogodak -> izaberi ga
        popuniIznos();
      } else if (izabran && lista.some(c => String(c.id) === izabran)) {
        sel.value = izabran;
      }
    }
    document.getElementById('trazi_clana').addEventListener('input',
      e => prikaziOpcijeClanova(e.target.value));

    // Kad se izabere clan, predlozi iznos iz mesecne clanarine njegove grupe
    function popuniIznos() {
      const c = aktivniClanovi.find(x => String(x.id) === document.getElementById('clan_id').value);
      const clanarina = c?.grupe?.mesecna_clanarina;
      if (clanarina) document.getElementById('iznos').value = clanarina;
    }
    document.getElementById('clan_id').addEventListener('change', popuniIznos);

    document.getElementById('uplataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('sacuvajBtn');
      const podaci = {
        clan_id: Number(document.getElementById('clan_id').value),
        iznos: Number(document.getElementById('iznos').value),
        za_mesec: document.getElementById('za_mesec').value + '-01',
        datum_uplate: val('datum_uplate') ?? todayStr(),
        nacin_placanja: document.getElementById('nacin_placanja').value,
        napomena: val('napomena'),
      };

      setBusy(btn, true);
      try {
        // Upozorenje ako za tog clana i mesec vec postoji uplata
        const { data: postojece, error: err1 } = await db.from('uplate')
          .select('id').eq('clan_id', podaci.clan_id).eq('za_mesec', podaci.za_mesec);
        if (err1) return showAlert('Greška pri proveri: ' + err1.message);
        if (postojece.length > 0) {
          const ok = await confirmDialog(
            `Za ovog člana već postoji uplata za ${fmtMonth(podaci.za_mesec)}. Da li ipak želiš da sačuvaš još jednu?`,
            { okText: 'Sačuvaj ipak' });
          if (!ok) return;
        }

        const { error } = await db.from('uplate').insert(podaci);
        if (error) return showAlert('Greška pri čuvanju: ' + error.message);

        showAlert('Uplata je sačuvana.', 'success');
        // Mesec, datum i nacin placanja ostaju, da bi unos vise uplata zaredom bio brz
        document.getElementById('napomena').value = '';
        document.getElementById('iznos').value = '';
        document.getElementById('clan_id').value = '';
        document.getElementById('trazi_clana').value = '';
        prikaziOpcijeClanova('');
        document.getElementById('filterMesec').value = podaci.za_mesec.slice(0, 7);
        await ucitajUplate();
      } finally {
        setBusy(btn, false);
      }
    });

    async function ucitajUplate() {
      const mesec = document.getElementById('filterMesec').value;
      if (!mesec) return;

      const { data, error } = await db.from('uplate')
        .select('id, iznos, datum_uplate, nacin_placanja, napomena, clanovi(ime, prezime)')
        .eq('za_mesec', mesec + '-01')
        .order('datum_uplate', { ascending: false });
      if (error) return showAlert('Greška pri učitavanju uplata: ' + error.message);

      const tbody = document.getElementById('tabela');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Nema uplata za izabrani mesec.</td></tr>';
        document.getElementById('ukupno').innerHTML = '';
        return;
      }

      tbody.innerHTML = data.map(u => `
        <tr>
          <td class="naslov"><strong>${escapeHtml(u.clanovi?.prezime)} ${escapeHtml(u.clanovi?.ime)}</strong></td>
          <td data-label="Datum uplate">${fmtDate(u.datum_uplate)}</td>
          <td data-label="Iznos">${fmtMoney(u.iznos)}</td>
          <td data-label="Način">${escapeHtml(nazivVrste(u.nacin_placanja))}</td>
          ${u.napomena ? `<td data-label="Napomena">${escapeHtml(u.napomena)}</td>` : '<td class="d-none d-md-table-cell"></td>'}
          <td class="text-end akcije"><button class="btn btn-sm btn-outline-danger" onclick="obrisiUplatu(${u.id})">Obriši</button></td>
        </tr>`).join('');

      const zbir = data.reduce((s, u) => s + Number(u.iznos), 0);
      document.getElementById('ukupno').innerHTML =
        `<tr><td colspan="2">Ukupno (${data.length} uplata)</td><td colspan="4">${fmtMoney(zbir)}</td></tr>`;
    }
    document.getElementById('filterMesec').addEventListener('change', ucitajUplate);

    // ===== Stampanje izvestaja =====
    function otvoriStampu() {
      document.getElementById('stampaMesec').value = document.getElementById('filterMesec').value || thisMonthStr();
      document.getElementById('stampaVrsta').value = '';
      document.getElementById('stampaPoruka').innerHTML = '';
      bootstrap.Modal.getOrCreateInstance(document.getElementById('stampaModal')).show();
    }

    document.getElementById('stampaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mesec = document.getElementById('stampaMesec').value;
      const vrsta = document.getElementById('stampaVrsta').value;
      const poruka = document.getElementById('stampaPoruka');
      poruka.innerHTML = '';

      let upit = db.from('uplate')
        .select('iznos, datum_uplate, clanovi(ime, prezime)')
        .eq('za_mesec', mesec + '-01');
      if (vrsta) upit = upit.eq('nacin_placanja', vrsta);
      const { data, error } = await upit.order('datum_uplate');

      if (error) {
        poruka.innerHTML = `<div class="alert alert-danger mb-0">Greška: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (data.length === 0) {
        poruka.innerHTML = '<div class="alert alert-warning mb-0">Nema uplata za izabrani mesec i vrstu uplate.</div>';
        return;
      }

      // po datumu uplate, a unutar istog dana po prezimenu
      data.sort((a, b) =>
        a.datum_uplate.localeCompare(b.datum_uplate) ||
        (a.clanovi?.prezime ?? '').localeCompare(b.clanovi?.prezime ?? '', 'sr'));

      const redovi = data.map((u, i) => `
        <tr>
          <td>${i + 1}.</td>
          <td>${escapeHtml(u.clanovi?.ime)} ${escapeHtml(u.clanovi?.prezime)}</td>
          <td>${fmtDate(u.datum_uplate)}</td>
          <td class="text-end">${fmtMoney(u.iznos)}</td>
        </tr>`).join('');
      const zbir = data.reduce((s, u) => s + Number(u.iznos), 0);

      document.getElementById('stampa').innerHTML = `
        <h2 class="h4 mb-0">Plivački klub Poseidon Paraćin</h2>
        <h3 class="h5 mb-3">Izveštaj o uplatama</h3>
        <p class="mb-3">
          Za mesec: <strong>${fmtMonth(mesec + '-01')}</strong><br>
          Vrsta uplate: <strong>${vrsta ? nazivVrste(vrsta) : 'Sve vrste'}</strong><br>
          Datum štampe: ${fmtDate(todayStr())}
        </p>
        <table class="table table-sm table-bordered">
          <thead><tr><th>R.br.</th><th>Ime i prezime</th><th>Datum uplate</th><th class="text-end">Iznos</th></tr></thead>
          <tbody>${redovi}</tbody>
          <tfoot><tr class="fw-bold"><td colspan="3">Ukupno (${data.length} uplata)</td><td class="text-end">${fmtMoney(zbir)}</td></tr></tfoot>
        </table>`;

      // zatvori prozor, pa tek onda stampaj da prozor ne zavrsi u ispisu
      const modalEl = document.getElementById('stampaModal');
      modalEl.addEventListener('hidden.bs.modal', () => window.print(), { once: true });
      bootstrap.Modal.getOrCreateInstance(modalEl).hide();
    });

    async function obrisiUplatu(id) {
      const ok = await confirmDialog('Da li sigurno želiš da obrišeš ovu uplatu?', { okText: 'Obriši', danger: true });
      if (!ok) return;
      const { error } = await db.from('uplate').delete().eq('id', id);
      if (error) return showAlert('Greška pri brisanju: ' + error.message);
      await ucitajUplate();
    }
  </script>
</body>
</html>
