<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a4a78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PK Poseidon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Dugovanja - PK Poseidon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid container-lg pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Dugovanja</h1>
        <p class="text-muted mb-0" id="podnaslov">Aktivni članovi koji nisu platili izabrani mesec.</p>
      </div>
      <div style="min-width: 220px;">
        <label class="form-label small mb-0">Mesec</label>
        <div class="input-group">
          <button class="btn btn-outline-secondary" type="button" onclick="pomeri(-1)" aria-label="Prethodni mesec">‹</button>
          <input type="month" id="mesec" class="form-control">
          <button class="btn btn-outline-secondary" type="button" onclick="pomeri(1)" aria-label="Sledeći mesec">›</button>
        </div>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="card shadow-sm mb-3">
      <div class="card-body d-flex flex-wrap align-items-center gap-3">
        <button class="btn btn-primary" onclick="posaljiViber()">📨 Pripremi poruku za Viber</button>
        <div class="small text-muted" id="viberStatus"></div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-md-4">
        <div class="card shadow-sm h-100"><div class="card-body">
          <div class="text-muted small">Članova koji duguju</div>
          <div class="fs-4 fw-semibold" id="brojDuznika">—</div>
        </div></div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card shadow-sm h-100"><div class="card-body">
          <div class="text-muted small">Ukupno neplaćeno</div>
          <div class="fs-4 fw-semibold" id="ukupnoDug">—</div>
        </div></div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 tabela-kartice">
          <thead class="table-light">
            <tr><th>Član</th><th>Grupa</th><th>Telefon</th><th>Članarina</th><th></th></tr>
          </thead>
          <tbody id="tabela"><tr><td colspan="5" class="text-center text-muted py-4">Učitavanje...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    (async () => {
      if (!(await requireLogin())) return;
      renderNavbar('dugovi');
      osveziViberStatus();
      document.getElementById('mesec').value = thisMonthStr();
      await ucitaj();
    })();

    // Prikaz da li je poruka za ovu polovinu meseca vec poslata
    function osveziViberStatus() {
      const { deo, kljuc } = viberPeriod();
      const kada = deo === 1 ? 'prvu polovinu meseca' : 'drugu polovinu meseca';
      const poslato = viberDatumSlanja(kljuc);
      document.getElementById('viberStatus').innerHTML = poslato
        ? `✅ Poruka za ${kada} je pripremljena ${fmtDate(poslato)} (klikom na dugme možete je pripremiti ponovo).`
        : `Poruka za ${kada} još nije poslata.`;
    }

    function pomeri(delta) {
      const el = document.getElementById('mesec');
      el.value = shiftMonth(el.value || thisMonthStr(), delta);
      ucitaj();
    }
    document.getElementById('mesec').addEventListener('change', ucitaj);

    async function ucitaj() {
      const mesec = document.getElementById('mesec').value;
      if (!mesec) return;
      const prviDan = mesec + '-01';
      const zadnjiDan = lastDayOfMonth(mesec);

      document.getElementById('podnaslov').textContent =
        `Aktivni članovi koji nisu platili za ${fmtMonth(prviDan)}.`;

      const [clanoviRes, uplateRes] = await Promise.all([
        db.from('clanovi')
          .select('id, ime, prezime, telefon, datum_upisa, grupe(naziv, mesecna_clanarina)')
          .eq('aktivan', true)
          .order('prezime').order('ime'),
        db.from('uplate').select('clan_id').eq('za_mesec', prviDan),
      ]);
      if (clanoviRes.error) return showAlert('Greška pri učitavanju: ' + clanoviRes.error.message);
      if (uplateRes.error) return showAlert('Greška pri učitavanju: ' + uplateRes.error.message);

      const platili = new Set(uplateRes.data.map(u => u.clan_id));
      // Clan koji je upisan posle izabranog meseca ne duguje za taj mesec
      const data = clanoviRes.data.filter(c =>
        !platili.has(c.id) && (!c.datum_upisa || c.datum_upisa <= zadnjiDan));

      const tbody = document.getElementById('tabela');
      document.getElementById('brojDuznika').textContent = data.length;
      document.getElementById('ukupnoDug').textContent =
        fmtMoney(data.reduce((s, c) => s + Number(c.grupe?.mesecna_clanarina ?? 0), 0));

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-success py-4">Svi aktivni članovi su platili. 🎉</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(c => {
        const clanarina = c.grupe?.mesecna_clanarina;
        const tel = c.telefon
          ? `<a href="tel:${escapeHtml(c.telefon.replace(/[^\d+]/g, ''))}" class="text-decoration-none">${escapeHtml(c.telefon)}</a>`
          : '';
        return `
        <tr>
          <td class="naslov"><strong>${escapeHtml(c.prezime)} ${escapeHtml(c.ime)}</strong></td>
          <td data-label="Grupa">${escapeHtml(c.grupe?.naziv ?? '—')}</td>
          <td data-label="Telefon">${tel}</td>
          <td data-label="Članarina">${clanarina ? fmtMoney(clanarina) : '—'}</td>
          <td class="text-end akcije"><a class="btn btn-sm btn-success" href="uplate.html?clan=${c.id}&mesec=${mesec}">Unesi uplatu</a></td>
        </tr>`;
      }).join('');
    }
  </script>
</body>
</html>
