<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dugovanja - PK Poseidon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="nav"></div>

  <div class="container pb-5">
    <h1 class="h3 mb-1">Dugovanja</h1>
    <p class="text-muted" id="podnaslov">Aktivni članovi koji nisu platili tekući mesec.</p>
    <div id="alertBox"></div>

    <div class="row g-3 mb-3">
      <div class="col-sm-6 col-md-4">
        <div class="card shadow-sm"><div class="card-body">
          <div class="text-muted small">Članova koji duguju</div>
          <div class="fs-4 fw-semibold" id="brojDuznika">—</div>
        </div></div>
      </div>
      <div class="col-sm-6 col-md-4">
        <div class="card shadow-sm"><div class="card-body">
          <div class="text-muted small">Ukupno neplaćeno</div>
          <div class="fs-4 fw-semibold" id="ukupnoDug">—</div>
        </div></div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Član</th><th>Grupa</th><th>Telefon</th><th>Članarina</th><th></th></tr>
          </thead>
          <tbody id="tabela"><tr><td colspan="5" class="text-center text-muted py-4">Učitavanje...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    (async () => {
      if (!(await requireLogin())) return;
      renderNavbar('dugovi');
      document.getElementById('podnaslov').textContent =
        `Aktivni članovi koji nisu platili za ${fmtMonth(todayStr().slice(0, 8) + '01')}.`;

      const { data, error } = await db.from('dugovi_tekuci_mesec').select('*').order('prezime').order('ime');
      if (error) return showAlert('Greška pri učitavanju: ' + error.message);

      const tbody = document.getElementById('tabela');
      document.getElementById('brojDuznika').textContent = data.length;
      document.getElementById('ukupnoDug').textContent =
        fmtMoney(data.reduce((s, c) => s + Number(c.mesecna_clanarina ?? 0), 0));

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-success py-4">Svi aktivni članovi su platili. 🎉</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(c => `
        <tr>
          <td><strong>${escapeHtml(c.prezime)} ${escapeHtml(c.ime)}</strong></td>
          <td>${escapeHtml(c.grupa ?? '—')}</td>
          <td>${escapeHtml(c.telefon ?? '')}</td>
          <td>${c.mesecna_clanarina ? fmtMoney(c.mesecna_clanarina) : '—'}</td>
          <td class="text-end"><a class="btn btn-sm btn-success" href="uplate.html?clan=${c.id}">Unesi uplatu</a></td>
        </tr>`).join('');
    })();
  </script>
</body>
</html>
