<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a4a78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PK Poseidon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Dolasci - PK Poseidon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    /* ----- Mesecna mreza (PC / iPad) ----- */
    .mreza-wrap { max-height: 72vh; max-height: 72dvh; overflow: auto; -webkit-overflow-scrolling: touch; }
    .mreza th, .mreza td { text-align: center; padding: .25rem .35rem; white-space: nowrap; }
    .mreza .ime {
      position: sticky; left: 0; z-index: 2; background: #fff;
      text-align: left; min-width: 170px; border-right: 2px solid #dee2e6;
    }
    .mreza thead th { position: sticky; top: 0; z-index: 3; background: #f8f9fa; }
    .mreza thead th.ime { z-index: 4; }
    .mreza tfoot td { position: sticky; bottom: 0; z-index: 3; background: #f8f9fa; font-weight: 600; }
    .mreza tfoot td.ime { z-index: 4; }
    .mreza .vikend { background: #f1f3f5; }
    .mreza thead th.vikend { background: #e9ecef; }
    .mreza input[type=checkbox] { width: 1.15rem; height: 1.15rem; cursor: pointer; }
    .mreza .neaktivan { color: #6c757d; }

    /* ----- Dnevni prikaz (telefon) ----- */
    .dan-red {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: .85rem 1rem; margin: 0; cursor: pointer;
      border-bottom: 1px solid #e9ecef; min-height: 60px;
      -webkit-tap-highlight-color: transparent;
    }
    .dan-red:last-child { border-bottom: 0; }
    .dan-red.prisutan { background: rgba(15, 138, 114, .12); }
    .dan-red input[type=checkbox] { width: 1.9rem; height: 1.9rem; flex: 0 0 auto; margin: 0; cursor: pointer; }
    .dan-red .neaktivan { color: #6c757d; }
    .dan-lista { max-height: none; }
    @media (min-width: 768px) {
      .dan-lista { max-height: 65vh; overflow: auto; }
    }

    @media print {
      #nav, .no-print, #alertBox { display: none !important; }
      .mreza-wrap { max-height: none; overflow: visible; }
      .mreza th, .mreza td { font-size: 9px; padding: 1px 2px; }
      .mreza thead th, .mreza tfoot td, .mreza .ime { position: static; }
      @page { size: landscape; margin: 8mm; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid px-3 px-md-4 pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Dolasci na trening <span class="text-muted fs-5" id="naslovMeseca"></span></h1>
      <div class="d-flex gap-2 no-print">
        <div class="btn-group" role="group" aria-label="Prikaz">
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnDan">Dan</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnMesec">Mesec</button>
        </div>
        <button class="btn btn-outline-secondary btn-sm" id="btnStampa" onclick="window.print()">🖨 Štampaj</button>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="row g-2 mb-3 align-items-end no-print">
      <!-- Izbor dana (dnevni prikaz) -->
      <div class="col-12 col-md-5 col-lg-4" id="kontrolaDan">
        <label class="form-label small mb-0">Dan</label>
        <div class="input-group">
          <button class="btn btn-outline-secondary" type="button" onclick="pomeriDan(-1)" aria-label="Prethodni dan">‹</button>
          <input type="date" id="danInput" class="form-control">
          <button class="btn btn-outline-secondary" type="button" onclick="pomeriDan(1)" aria-label="Sledeći dan">›</button>
          <button class="btn btn-outline-primary" type="button" onclick="idiNaDanas()">Danas</button>
        </div>
      </div>
      <!-- Izbor meseca (mesecni prikaz) -->
      <div class="col-12 col-md-5 col-lg-4" id="kontrolaMesec">
        <label class="form-label small mb-0">Mesec</label>
        <div class="input-group">
          <button class="btn btn-outline-secondary" type="button" onclick="pomeriMesec(-1)" aria-label="Prethodni mesec">‹</button>
          <input type="month" id="mesec" class="form-control">
          <button class="btn btn-outline-secondary" type="button" onclick="pomeriMesec(1)" aria-label="Sledeći mesec">›</button>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small mb-0">Grupa</label>
        <select id="filterGrupa" class="form-select"><option value="">Sve grupe</option></select>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <label class="form-label small mb-0">Pretraga</label>
        <input type="search" id="search" class="form-control" placeholder="Ime ili prezime...">
      </div>
    </div>

    <!-- DNEVNI PRIKAZ -->
    <div class="card shadow-sm no-print" id="danKartica">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <div class="fw-semibold" id="danNaslov"></div>
          <div class="text-muted small" id="danBroj"></div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-success" onclick="oznaciSve(true)">Označi sve</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="oznaciSve(false)">Poništi sve</button>
        </div>
      </div>
      <div id="danLista" class="dan-lista"></div>
    </div>

    <!-- MESECNI PRIKAZ -->
    <div class="card shadow-sm" id="mesecKartica">
      <div class="mreza-wrap">
        <table class="table table-sm table-bordered align-middle mb-0 mreza">
          <thead id="zaglavlje"></thead>
          <tbody id="telo"><tr><td class="text-muted py-4">Učitavanje...</td></tr></tbody>
          <tfoot id="podnozje"></tfoot>
        </table>
      </div>
    </div>
    <p class="text-muted small mt-2 no-print" id="uputstvo"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    let rezim = window.matchMedia('(max-width: 767.98px)').matches ? 'dan' : 'mesec';
    let dan = todayStr();        // izabrani dan (dnevni prikaz)
    let mesec = '';              // ucitani mesec 'YYYY-MM'
    let clanovi = [];            // svi clanovi koji se prikazuju za ucitani mesec
    let prikazani = [];          // posle filtera
    let dolasci = new Set();     // kljuc: 'clanId|YYYY-MM-DD'
    let brojDana = 30;

    const SLOVA_DANA = ['ned', 'pon', 'uto', 'sre', 'čet', 'pet', 'sub']; // nedelja ... subota
    const NAZIVI_DANA = ['nedelja', 'ponedeljak', 'utorak', 'sreda', 'četvrtak', 'petak', 'subota'];
    const el = id => document.getElementById(id);

    (async () => {
      if (!(await requireLogin())) return;
      renderNavbar('dolasci');
      el('mesec').value = thisMonthStr();
      el('danInput').value = dan;
      osveziRezimUI();
      await ucitajGrupe();
      await ucitaj();
    })();

    async function ucitajGrupe() {
      const { data, error } = await db.from('grupe').select('id, naziv').order('naziv');
      if (error) return showAlert('Greška pri učitavanju grupa: ' + error.message);
      el('filterGrupa').innerHTML =
        '<option value="">Sve grupe</option>' +
        data.map(g => `<option value="${g.id}">${escapeHtml(g.naziv)}</option>`).join('');
    }

    // ===== Prebacivanje Dan / Mesec =====
    function osveziRezimUI() {
      const dnevni = rezim === 'dan';
      el('kontrolaDan').classList.toggle('d-none', !dnevni);
      el('kontrolaMesec').classList.toggle('d-none', dnevni);
      el('danKartica').classList.toggle('d-none', !dnevni);
      el('mesecKartica').classList.toggle('d-none', dnevni);
      el('btnStampa').classList.toggle('d-none', dnevni);
      el('btnDan').classList.toggle('active', dnevni);
      el('btnMesec').classList.toggle('active', !dnevni);
      el('uputstvo').textContent = dnevni
        ? 'Dodirni člana da zabeležiš dolazak, a ponovnim dodirom ga poništavaš. Čuva se odmah.'
        : 'Klikni na polje da zabeležiš dolazak, a ponovnim klikom ga poništavaš. Čuva se odmah.';
    }

    async function promeniRezim(r) {
      if (r === rezim) return;
      rezim = r;
      if (r === 'dan') {
        if (!dan.startsWith(el('mesec').value)) {
          dan = el('mesec').value === thisMonthStr() ? todayStr() : el('mesec').value + '-01';
        }
        el('danInput').value = dan;
      } else {
        el('mesec').value = dan.slice(0, 7);
      }
      osveziRezimUI();
      await ucitaj();
    }
    el('btnDan').addEventListener('click', () => promeniRezim('dan'));
    el('btnMesec').addEventListener('click', () => promeniRezim('mesec'));

    // ===== Ucitavanje podataka za mesec =====
    async function ucitaj() {
      mesec = rezim === 'dan' ? dan.slice(0, 7) : el('mesec').value;
      if (!mesec) return;

      brojDana = Number(lastDayOfMonth(mesec).slice(-2));
      el('naslovMeseca').textContent = '· ' + fmtMonth(mesec + '-01');

      const od = `${mesec}-01`;
      const doDatuma = lastDayOfMonth(mesec);

      // Supabase vraca najvise 1000 redova odjednom, pa ucitavamo u delovima
      let svi = [];
      const korak = 1000;
      for (let from = 0; ; from += korak) {
        const { data, error } = await db.from('dolasci')
          .select('clan_id, datum')
          .gte('datum', od).lte('datum', doDatuma)
          .order('id')
          .range(from, from + korak - 1);
        if (error) return showAlert('Greška pri učitavanju dolazaka: ' + error.message);
        svi = svi.concat(data);
        if (data.length < korak) break;
      }
      dolasci = new Set(svi.map(r => `${r.clan_id}|${r.datum}`));

      // Aktivni clanovi + posebno neaktivni koji imaju dolaske u tom mesecu
      const kolone = 'id, ime, prezime, grupa_id, aktivan';
      const aktivniRes = await db.from('clanovi').select(kolone).eq('aktivan', true);
      if (aktivniRes.error) return showAlert('Greška pri učitavanju članova: ' + aktivniRes.error.message);
      let lista = aktivniRes.data;

      const aktivniIds = new Set(lista.map(c => c.id));
      const neaktivniIds = [...new Set(svi.map(r => r.clan_id))].filter(id => !aktivniIds.has(id));
      if (neaktivniIds.length) {
        const nRes = await db.from('clanovi').select(kolone).in('id', neaktivniIds);
        if (nRes.error) return showAlert('Greška pri učitavanju članova: ' + nRes.error.message);
        lista = lista.concat(nRes.data);
      }
      lista.sort((a, b) => a.prezime.localeCompare(b.prezime, 'sr') || a.ime.localeCompare(b.ime, 'sr'));
      clanovi = lista;

      prikazi();
    }

    function prikazi() {
      const q = norm(el('search').value.trim());
      const grupa = el('filterGrupa').value;

      prikazani = clanovi.filter(c => {
        if (grupa && String(c.grupa_id) !== grupa) return false;
        if (q && !norm(`${c.ime} ${c.prezime}`).includes(q)) return false;
        return true;
      });

      if (rezim === 'dan') prikaziDan(); else prikaziMesec();
    }

    // ===== Dnevni prikaz =====
    function prikaziDan() {
      const [y, m, d] = dan.split('-').map(Number);
      const w = new Date(y, m - 1, d).getDay();
      el('danNaslov').textContent = `${NAZIVI_DANA[w]}, ${fmtDate(dan)}`;

      if (prikazani.length === 0) {
        el('danLista').innerHTML = '<div class="text-center text-muted py-4">Nema članova za prikaz.</div>';
        el('danBroj').textContent = '';
        return;
      }
      el('danLista').innerHTML = prikazani.map(c => {
        const on = dolasci.has(`${c.id}|${dan}`);
        return `<label class="dan-red ${on ? 'prisutan' : ''}">
          <span class="${c.aktivan ? '' : 'neaktivan'}"><strong>${escapeHtml(c.prezime)}</strong> ${escapeHtml(c.ime)}${c.aktivan ? '' : ' <small>(neaktivan)</small>'}</span>
          <input type="checkbox" class="form-check-input dolazak-cb" data-clan="${c.id}" data-datum="${dan}" ${on ? 'checked' : ''}>
        </label>`;
      }).join('');
      osveziZbirove();
    }

    function pomeriDan(delta) {
      const [y, m, d] = dan.split('-').map(Number);
      const n = new Date(y, m - 1, d + delta);
      postaviDan(`${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`);
    }
    function idiNaDanas() { postaviDan(todayStr()); }
    el('danInput').addEventListener('change', e => { if (e.target.value) postaviDan(e.target.value); });

    function postaviDan(novi) {
      const stariMesec = dan.slice(0, 7);
      dan = novi;
      el('danInput').value = dan;
      if (dan.slice(0, 7) !== stariMesec) ucitaj(); else prikazi();
    }

    // Oznaci / ponisti sve prikazane clanove za izabrani dan
    async function oznaciSve(stanje) {
      if (prikazani.length === 0) return;
      const n = prikazani.length;
      const ok = await confirmDialog(
        stanje
          ? `Označiti svih ${n} prikazanih članova kao prisutne za ${fmtDate(dan)}?`
          : `Poništiti dolaske za svih ${n} prikazanih članova za ${fmtDate(dan)}?`,
        { okText: stanje ? 'Označi sve' : 'Poništi sve', danger: !stanje });
      if (!ok) return;

      if (stanje) {
        const novi = prikazani.filter(c => !dolasci.has(`${c.id}|${dan}`)).map(c => ({ clan_id: c.id, datum: dan }));
        if (novi.length) {
          const { error } = await db.from('dolasci').insert(novi);
          if (error) return showAlert('Greška pri čuvanju: ' + error.message);
          novi.forEach(r => dolasci.add(`${r.clan_id}|${r.datum}`));
        }
      } else {
        const { error } = await db.from('dolasci').delete().in('clan_id', prikazani.map(c => c.id)).eq('datum', dan);
        if (error) return showAlert('Greška pri brisanju: ' + error.message);
        prikazani.forEach(c => dolasci.delete(`${c.id}|${dan}`));
      }
      prikazi();
    }

    // ===== Mesecni prikaz =====
    function prikaziMesec() {
      const [y, m] = mesec.split('-').map(Number);
      const dani = Array.from({ length: brojDana }, (_, i) => i + 1);
      const jeVikend = d => { const w = new Date(y, m - 1, d).getDay(); return w === 0 || w === 6; };

      el('zaglavlje').innerHTML =
        '<tr><th class="ime">Član</th>' +
        dani.map(d => {
          const w = new Date(y, m - 1, d).getDay();
          return `<th class="${jeVikend(d) ? 'vikend' : ''}"><div>${d}</div><div class="small text-muted">${SLOVA_DANA[w]}</div></th>`;
        }).join('') +
        '<th>Ukupno</th></tr>';

      const telo = el('telo');
      if (prikazani.length === 0) {
        telo.innerHTML = `<tr><td colspan="${brojDana + 2}" class="text-muted py-4">Nema članova za prikaz.</td></tr>`;
        el('podnozje').innerHTML = '';
        return;
      }

      telo.innerHTML = prikazani.map(c => {
        const celije = dani.map(d => {
          const datum = `${mesec}-${pad(d)}`;
          const cekirano = dolasci.has(`${c.id}|${datum}`) ? 'checked' : '';
          return `<td class="${jeVikend(d) ? 'vikend' : ''}"><input type="checkbox" class="form-check-input dolazak-cb" data-clan="${c.id}" data-datum="${datum}" ${cekirano}></td>`;
        }).join('');
        return `<tr>
          <td class="ime ${c.aktivan ? '' : 'neaktivan'}">${escapeHtml(c.prezime)} ${escapeHtml(c.ime)}${c.aktivan ? '' : ' <small>(neaktivan)</small>'}</td>
          ${celije}
          <td class="fw-semibold" id="tot_clan_${c.id}">0</td>
        </tr>`;
      }).join('');

      el('podnozje').innerHTML =
        '<tr><td class="ime">Prisutno</td>' +
        dani.map(d => `<td id="tot_dan_${d}" class="${jeVikend(d) ? 'vikend' : ''}">0</td>`).join('') +
        '<td id="tot_sve">0</td></tr>';

      osveziZbirove();
    }

    // Preracuna zbirove (samo za prikazane clanove)
    function osveziZbirove() {
      if (rezim === 'dan') {
        const prisutno = prikazani.filter(c => dolasci.has(`${c.id}|${dan}`)).length;
        el('danBroj').textContent = `Prisutno: ${prisutno} od ${prikazani.length}`;
        return;
      }
      const poDanu = new Array(brojDana + 1).fill(0);
      let sve = 0;
      prikazani.forEach(c => {
        let brojac = 0;
        for (let d = 1; d <= brojDana; d++) {
          if (dolasci.has(`${c.id}|${mesec}-${pad(d)}`)) { brojac++; poDanu[d]++; }
        }
        sve += brojac;
        const e = el('tot_clan_' + c.id);
        if (e) e.textContent = brojac;
      });
      for (let d = 1; d <= brojDana; d++) {
        const e = el('tot_dan_' + d);
        if (e) e.textContent = poDanu[d] || '';
      }
      const ukupno = el('tot_sve');
      if (ukupno) ukupno.textContent = sve;
    }

    // Klik na polje (u oba prikaza): upisi ili obrisi dolazak
    document.addEventListener('change', async (e) => {
      const cb = e.target;
      if (!cb.classList || !cb.classList.contains('dolazak-cb')) return;

      const clan = Number(cb.dataset.clan);
      const datum = cb.dataset.datum;
      const kljuc = `${clan}|${datum}`;
      const red = cb.closest('.dan-red');
      cb.disabled = true;

      let error;
      if (cb.checked) {
        ({ error } = await db.from('dolasci').insert({ clan_id: clan, datum }));
        if (!error || error.code === '23505') { dolasci.add(kljuc); error = null; }
      } else {
        ({ error } = await db.from('dolasci').delete().eq('clan_id', clan).eq('datum', datum));
        if (!error) dolasci.delete(kljuc);
      }

      cb.disabled = false;
      if (error) {
        cb.checked = !cb.checked;   // vrati staro stanje
        return showAlert('Greška pri čuvanju: ' + error.message);
      }
      if (red) red.classList.toggle('prisutan', cb.checked);
      osveziZbirove();
    });

    function pomeriMesec(delta) {
      el('mesec').value = shiftMonth(el('mesec').value || thisMonthStr(), delta);
      ucitaj();
    }

    el('mesec').addEventListener('change', ucitaj);
    el('search').addEventListener('input', prikazi);
    el('filterGrupa').addEventListener('input', prikazi);
  </script>
</body>
</html>
