<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupe - PK Poseidon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="nav"></div>

  <div class="container pb-5">
    <h1 class="h3 mb-3">Grupe i članarine</h1>
    <div id="alertBox"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-semibold">Nova grupa</div>
      <div class="card-body">
        <form id="grupaForm" class="row g-2 align-items-end">
          <div class="col-md-5">
            <label class="form-label">Naziv *</label>
            <input id="novi_naziv" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Mesečna članarina (RSD) *</label>
            <input type="number" id="nova_clanarina" class="form-control" min="0" step="0.01" required>
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100">Dodaj grupu</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr><th>Naziv</th><th>Mesečna članarina (RSD)</th><th></th></tr>
          </thead>
          <tbody id="tabela"><tr><td colspan="3" class="text-center text-muted py-4">Učitavanje...</td></tr></tbody>
        </table>
      </div>
    </div>
    <p class="text-muted small mt-2">Promena članarine važi za buduće uplate. Već unete uplate se ne menjaju.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    (async () => {
      if (!(await requireLogin())) return;
      renderNavbar('grupe');
      await ucitaj();
    })();

    async function ucitaj() {
      const { data, error } = await db.from('grupe').select('*').order('naziv');
      if (error) return showAlert('Greška pri učitavanju: ' + error.message);

      const tbody = document.getElementById('tabela');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4">Još nema grupa.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(g => `
        <tr>
          <td><input class="form-control" id="naziv_${g.id}" value="${escapeHtml(g.naziv)}"></td>
          <td><input type="number" class="form-control" id="clanarina_${g.id}" value="${g.mesecna_clanarina}" min="0" step="0.01"></td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-primary" onclick="sacuvaj(${g.id})">Sačuvaj</button>
            <button class="btn btn-sm btn-outline-danger" onclick="obrisi(${g.id})">Obriši</button>
          </td>
        </tr>`).join('');
    }

    document.getElementById('grupaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await db.from('grupe').insert({
        naziv: document.getElementById('novi_naziv').value.trim(),
        mesecna_clanarina: Number(document.getElementById('nova_clanarina').value),
      });
      if (error) {
        return showAlert(error.code === '23505' ? 'Grupa sa tim nazivom već postoji.' : 'Greška: ' + error.message);
      }
      e.target.reset();
      showAlert('Grupa je dodata.', 'success');
      await ucitaj();
    });

    async function sacuvaj(id) {
      const { error } = await db.from('grupe').update({
        naziv: document.getElementById('naziv_' + id).value.trim(),
        mesecna_clanarina: Number(document.getElementById('clanarina_' + id).value),
      }).eq('id', id);
      if (error) {
        return showAlert(error.code === '23505' ? 'Grupa sa tim nazivom već postoji.' : 'Greška: ' + error.message);
      }
      showAlert('Sačuvano.', 'success');
    }

    async function obrisi(id) {
      if (!confirm('Obrisati grupu? Članovi iz te grupe ostaju, ali će biti bez grupe.')) return;
      const { error } = await db.from('grupe').delete().eq('id', id);
      if (error) return showAlert('Greška pri brisanju: ' + error.message);
      await ucitaj();
    }
  </script>
</body>
</html>
